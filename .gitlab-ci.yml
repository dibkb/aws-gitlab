image: python:3.9-slim

variables:
  AWS_EC2_HOST: $AWS_EC2_HOST
  AWS_SSH_KEY: $AWS_SSH_KEY
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  IMAGE_NAME: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - docker build -t $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - prod

deploy:
  stage: deploy
  variables:
    SSH_USER: "ubuntu"
  before_script:
    # Install required packages
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
    # Configure SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add EC2 host to known_hosts with verbose output and error checking
    - |
      if ! ssh-keyscan -v -H $AWS_EC2_HOST >> ~/.ssh/known_hosts; then
        echo "Failed to scan SSH host keys. Check if AWS_EC2_HOST is correctly set and the instance is running."
        exit 1
      fi
    # Write SSH key
    - echo "$AWS_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Optional: Configure SSH client (timeout settings)
    - echo -e "Host $AWS_EC2_HOST\n\tConnectTimeout 30\n\tServerAliveInterval 60" > ~/.ssh/config
  script:
    - |
      ssh -i ~/.ssh/id_rsa $SSH_USER@$AWS_EC2_HOST << 'EOF'
        # Pull latest image (no need to login every time; credentials are in ~/.docker/config.json)
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Stop/remove old container
        docker stop fastapi-app || true
        docker rm -f fastapi-app || true

        # Run new container with:
        # - Environment variables
        # - Proper restart policy
        # - Health checks
        docker run -d \
          --name fastapi-app \
          -p 8000:8090 \
          --restart unless-stopped \
          $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Clean up unused images (avoid pruning everything!)
        docker image prune -af --filter "until=24h"
      EOF
  only:
    - prod
