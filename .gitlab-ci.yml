image: python:3.9-slim

variables:
  AWS_EC2_HOST: $AWS_EC2_HOST
  AWS_SSH_KEY: $AWS_SSH_KEY
  IMAGE_TAG: $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - test
  - build
  - deploy

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker tag $IMAGE_TAG $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:latest

    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:latest
  only:
    - prod
