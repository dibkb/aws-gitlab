image: python:3.9-slim

variables:
  AWS_EC2_HOST: $AWS_EC2_HOST
  AWS_SSH_KEY: $AWS_SSH_KEY
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  IMAGE_NAME: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - docker build -t $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - prod

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - apt-get -y install sudo
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$AWS_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - |
      ssh ubuntu@$AWS_EC2_HOST "
        # Pull latest Docker image
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
        docker pull $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Stop and remove existing container if it exists
        docker stop fastapi-app || true
        docker container rm -f fastapi-app || true

        # Run new container
        docker run -d \
          --name fastapi-app \
          -p 8000:8090 \
          --restart unless-stopped \
          $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Clean up old images
        docker system prune -f
      "
  only:
    - prod
