image: python:3.9-slim

variables:
  AWS_EC2_HOST: $AWS_EC2_HOST
  AWS_SSH_KEY: $AWS_SSH_KEY
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  IMAGE_NAME: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - docker build -t $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_USER/$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - prod

deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client #
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Write the SSH key to a file (use `-f` if variable is type=File)
    - echo "$AWS_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Disable host key checking (optional for CI)
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/con
  script:
    - |
      ssh -T -i ~/.ssh/id_rsa ec2-user@$AWS_EC2_HOST << 'EOF'
        # Pull latest image (no need to login every time; credentials are in ~/.docker/config.json)
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Stop/remove old container
        docker stop fastapi-app || true
        docker rm -f fastapi-app || true

        # Run new container with:
        # - Environment variables
        # - Proper restart policy
        # - Health checks
        docker run -d \
          --name fastapi-app \
          -p 8000:8090 \
          --restart unless-stopped \
          -e APP_ENV=prod \
          -e DATABASE_URL="$PROD_DB_URL" \
          --health-cmd="curl --fail http://localhost:8090/health || exit 1" \
          --health-interval=30s \
          $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

        # Clean up unused images (avoid pruning everything!)
        docker image prune -af --filter "until=24h"
      EOF
  only:
    - prod
